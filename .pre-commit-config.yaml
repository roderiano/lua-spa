default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff-fix-and-sort-imports
        always_run: true
        pass_filenames: false
        args:
          [
            "--fix",
            "--extend-select=I",
            ".",
          ]

      - id: ruff
        name: ruff-check
        always_run: true
        pass_filenames: false
        args: ["."]

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        name: black-format
        always_run: true
        pass_filenames: false
        args: ["."]

      - id: black
        name: black-check
        always_run: true
        pass_filenames: false
        args: ["--check", "."]

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        always_run: true
        pass_filenames: false
        args: ["."]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy-strict
        always_run: true
        pass_filenames: false
        args: ["--strict", "src", "tests"]
