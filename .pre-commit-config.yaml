default_stages: [pre-commit]

# Exclude .venv and .env from all hooks
exclude: '(^\.venv/|^\.env/)'

repos:
  - repo: local
    hooks:
      - id: python-quality-gate
        name: python-quality-gate
        entry: python scripts/precommit_quality_gate.py
        language: python
        always_run: true
        pass_filenames: false
        additional_dependencies:
          - mypy==1.11.2
          - ruff==0.6.9
