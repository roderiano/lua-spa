[project]
name = "lua-spa"
version = "0.1.0"
description = "Initial Python package scaffold for the lua-spa application"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Gabriel da Rosa Silveira", email = "gabrielsilveirapro@gmail.com" }]
dependencies = ["mkdocs-material (>=9.7.6,<10.0.0)", "pymdown-extensions (>=10.21.2,<11.0.0)"]

[project.scripts]
lua-spa = "lua_spa.main:main"

[tool.poetry]
packages = [{ include = "lua_spa", from = "src" }]
include = [{ path = "src/lua_template", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.9"
mypy = "^1.11.2"
pre-commit = "^4.6.0"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
