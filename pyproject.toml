[project]
name = "moon-spa"
version = "2.3.3"
description = "Backend-first SPA framework in Python."
requires-python = ">=3.10,<4.0"
authors = [{ name = "Gabriel da Rosa Silveira", email = "gabrielsilveirapro@gmail.com" }]
dependencies = [
    "requests>=2.32.0,<3.0.0",
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"

[project.scripts]
moon-spa = "moon_spa.main:main"

[tool.poetry]
packages = [{ include = "moon_spa", from = "src" }]
include = [{ path = "src/moon_template", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.9"
mypy = "^1.11.2"
pre-commit = "^4.6.0"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_configs = true

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
