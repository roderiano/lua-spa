name: Release & Deploy

on:
  push:
    branches:
      - release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep '^version =' pyproject.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: v$VERSION"

      - name: Ensure version changed
        run: |
          if git diff HEAD~1 HEAD -- pyproject.toml | grep -q "version"; then
            echo "Version updated."
          else
            echo "Version not changed in this commit. Skipping release."
            exit 0
          fi

      - name: Check if tag already exists
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag already exists. Skipping."
            exit 0
          fi

      - name: Check if version exists on PyPI
        id: check_pypi
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          VERSION=${VERSION#v}

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pypi.org/pypi/lua-spa/$VERSION/json)

          if [ "$STATUS" = "200" ]; then
            echo "Version already exists on PyPI. Skipping publish."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Git Tag
        if: steps.check_pypi.outputs.exists == 'false'
        run: |
          git tag ${{ steps.get_version.outputs.version }}
          git push origin ${{ steps.get_version.outputs.version }}

      - name: Create GitHub Release
        if: steps.check_pypi.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy docs
        if: steps.check_pypi.outputs.exists == 'false'
        working-directory: ./docs
        run: |
          npm install
          npm run build
          npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Setup Python
        if: steps.check_pypi.outputs.exists == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build package
        if: steps.check_pypi.outputs.exists == 'false'
        run: |
          pip install poetry
          poetry install --no-interaction --no-root
          poetry build

      - name: Publish to PyPI
        if: steps.check_pypi.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1